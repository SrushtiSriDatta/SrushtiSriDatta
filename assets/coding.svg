<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <style>
    .float { animation: drift 4s ease-in-out infinite; }
    .f2 { animation-delay: -1.3s; } .f3 { animation-delay: -2.6s; }
    @keyframes drift { 0%,100% { transform: translate(0,0); opacity: .9; } 50% { transform: translate(10px,-6px); opacity: .45; } }
    .hand { animation: type .35s ease-in-out infinite alternate; }
    .hand2 { animation-delay: -.17s; }
    @keyframes type { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    .head { animation: nod 3s ease-in-out infinite; transform-origin: 552px 250px; }
    @keyframes nod { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-2deg); } }
    .steam { animation: rise 2.4s ease-in infinite; }
    .s2 { animation-delay: -1.2s; }
    @keyframes rise { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: .7; } 100% { transform: translateY(-16px); opacity: 0; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- floor shadow -->
  <ellipse cx="360" cy="446" rx="320" ry="10" fill="#E9D5FF" opacity=".6"/>

  <!-- floating code bars -->
  <g class="float"><rect x="150" y="86" width="70" height="5" rx="2.5" fill="#A78BFA"/><rect x="150" y="96" width="46" height="5" rx="2.5" fill="#C4B5FD"/></g>
  <g class="float f2"><rect x="250" y="70" width="110" height="5" rx="2.5" fill="#F472B6"/><rect x="250" y="80" width="80" height="5" rx="2.5" fill="#F9A8D4"/><rect x="262" y="90" width="64" height="5" rx="2.5" fill="#F9A8D4"/></g>
  <g class="float f3"><rect x="380" y="92" width="96" height="5" rx="2.5" fill="#5EEAD4"/><rect x="392" y="102" width="60" height="5" rx="2.5" fill="#99F6E4"/><rect x="392" y="112" width="78" height="5" rx="2.5" fill="#99F6E4"/></g>

  <!-- plant -->
  <path d="M78 392 L96 392 L92 440 L82 440 Z" fill="#FB923C"/>
  <path d="M87 392 C70 370 62 350 70 334 C80 350 86 368 87 392 Z" fill="#34D399"/>
  <path d="M87 392 C96 366 108 352 122 348 C116 368 104 382 87 392 Z" fill="#10B981"/>
  <path d="M87 392 C84 364 88 344 98 330 C102 352 96 374 87 392 Z" fill="#6EE7B7"/>

  <!-- desk -->
  <rect x="118" y="300" width="450" height="12" rx="4" fill="#C4B5FD"/>
  <rect x="140" y="312" width="9" height="130" fill="#94A3B8"/>
  <rect x="536" y="312" width="9" height="130" fill="#94A3B8"/>
  <rect x="140" y="340" width="405" height="5" fill="#CBD5E1"/>

  <!-- mug -->
  <rect x="124" y="280" width="20" height="20" rx="3" fill="#F472B6"/>
  <path d="M144 285 q8 0 8 7 q0 7 -8 7" fill="none" stroke="#F472B6" stroke-width="3"/>
  <path class="steam" d="M130 274 q-4 -6 0 -12" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <path class="steam s2" d="M138 274 q4 -6 0 -12" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <!-- monitor 1 -->
  <rect x="160" y="178" width="140" height="96" rx="6" fill="#334155"/>
  <rect x="166" y="184" width="128" height="84" rx="3" fill="url(#scr)"/>
  <rect x="222" y="274" width="16" height="18" fill="#475569"/><rect x="204" y="292" width="52" height="8" rx="3" fill="#475569"/>
  <g>
    <rect x="174" y="194" height="5" width="60" rx="2" fill="#F472B6"><animate attributeName="width" values="0;60;60;0" keyTimes="0;.3;.9;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="182" y="206" height="5" width="84" rx="2" fill="#5EEAD4"><animate attributeName="width" values="0;0;84;84;0" keyTimes="0;.15;.45;.9;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="182" y="218" height="5" width="50" rx="2" fill="#A78BFA"><animate attributeName="width" values="0;0;50;50;0" keyTimes="0;.3;.55;.9;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="190" y="230" height="5" width="70" rx="2" fill="#FCD34D"><animate attributeName="width" values="0;0;70;70;0" keyTimes="0;.45;.7;.9;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="174" y="242" height="5" width="30" rx="2" fill="#F472B6"><animate attributeName="width" values="0;0;30;30;0" keyTimes="0;.6;.8;.9;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect class="cur" x="208" y="252" width="6" height="8" fill="#E2E8F0"/>
  </g>

  <!-- monitor 2 -->
  <rect x="312" y="168" width="160" height="106" rx="6" fill="#334155"/>
  <rect x="318" y="174" width="148" height="94" rx="3" fill="url(#scr)"/>
  <rect x="384" y="274" width="16" height="18" fill="#475569"/><rect x="366" y="292" width="52" height="8" rx="3" fill="#475569"/>
  <rect x="318" y="174" width="148" height="12" fill="#312E81"/>
  <circle cx="326" cy="180" r="2.5" fill="#F87171"/><circle cx="334" cy="180" r="2.5" fill="#FCD34D"/><circle cx="342" cy="180" r="2.5" fill="#34D399"/>
  <!-- little chart on screen 2 -->
  <polyline fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="328,250 348,236 366,242 386,220 404,228 424,206 452,214">
    <animate attributeName="points" dur="4s" repeatCount="indefinite"
      values="328,250 348,236 366,242 386,220 404,228 424,206 452,214;
              328,246 348,240 366,226 386,232 404,214 424,220 452,200;
              328,250 348,236 366,242 386,220 404,228 424,206 452,214"/>
  </polyline>
  <rect x="330" y="256" width="40" height="4" rx="2" fill="#A78BFA"/><rect x="376" y="256" width="26" height="4" rx="2" fill="#F472B6"/>

  <!-- keyboard -->
  <rect x="392" y="294" width="78" height="6" rx="2" fill="#E2E8F0"/>

  <!-- chair -->
  <rect x="606" y="226" width="44" height="150" rx="14" fill="#64748B"/>
  <rect x="528" y="370" width="120" height="14" rx="6" fill="#475569"/>
  <rect x="584" y="384" width="9" height="40" fill="#475569"/>
  <path d="M548 432 L629 432" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <circle cx="550" cy="438" r="6" fill="#334155"/><circle cx="627" cy="438" r="6" fill="#334155"/>

  <!-- legs -->
  <path d="M572 372 L486 366" stroke="#1E293B" stroke-width="24" stroke-linecap="round"/>
  <path d="M486 366 L478 428" stroke="#1E293B" stroke-width="20" stroke-linecap="round"/>
  <path d="M466 436 L494 436" stroke="#F472B6" stroke-width="11" stroke-linecap="round"/>

  <!-- torso -->
  <path d="M540 268 C556 252 590 252 600 272 L604 376 L552 378 C546 340 536 300 540 268 Z" fill="url(#top)"/>
  <path d="M556 300 L590 300 M560 316 L594 316" stroke="#FCE7F3" stroke-width="3" opacity=".5"/>

  <!-- arms -->
  <path d="M552 280 L514 318" stroke="#C084FC" stroke-width="16" stroke-linecap="round"/>
  <g class="hand"><path d="M514 318 L470 298" stroke="#C084FC" stroke-width="13" stroke-linecap="round"/><circle cx="464" cy="296" r="7" fill="#B9774A"/></g>
  <g class="hand hand2"><path d="M528 300 L486 292" stroke="#D8B4FE" stroke-width="11" stroke-linecap="round" opacity=".9"/><circle cx="480" cy="291" r="6" fill="#A86A40"/></g>

  <!-- head -->
  <g class="head">
    <rect x="546" y="240" width="14" height="18" rx="5" fill="#A86A40"/>
    <ellipse cx="548" cy="226" rx="23" ry="25" fill="#B9774A"/>
    <path d="M526 224 C524 198 552 190 570 202 C582 212 578 236 572 246 C570 228 560 214 540 216 C534 218 528 222 526 224 Z" fill="#1F1B2E"/>
    <circle cx="584" cy="206" r="11" fill="#1F1B2E"/>
    <path d="M576 230 C590 250 594 268 586 286" stroke="#1F1B2E" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="563" cy="230" r="3.5" fill="#FCD34D"/>
  </g>
</svg>
