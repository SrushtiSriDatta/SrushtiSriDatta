<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Srushti SriDatta, Electronics and Communication Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="35%" stop-color="#db2777"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;20 .5 .5;0 .5 .5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".10"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <g fill="#ffffff" opacity=".12">
    <circle cx="90" cy="60" r="70"/><circle cx="1110" cy="210" r="90"/><circle cx="980" cy="40" r="34"/><circle cx="230" cy="220" r="26"/>
  </g>
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="2" fill="none">
    <path d="M60 200 h70 v-30 h60"/><circle cx="196" cy="170" r="6"/>
    <path d="M1150 40 h-60 v-14 h-50"/><circle cx="1034" cy="26" r="6"/>
  </g>
  <path d="M0 210 C 200 170, 400 250, 600 215 S 1000 180, 1200 220 V260 H0 Z" fill="url(#wave)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 210 C 200 170, 400 250, 600 215 S 1000 180, 1200 220 V260 H0 Z;M0 220 C 200 250, 400 180, 600 220 S 1000 250, 1200 205 V260 H0 Z;M0 210 C 200 170, 400 250, 600 215 S 1000 180, 1200 220 V260 H0 Z"/>
  </path>
  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Hi, I'm Srushti SriDatta <tspan font-size="56">👋</tspan>
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" fill-opacity=".92" letter-spacing="1">Electronics &amp; Communication Engineer · Hardware ⚡ Software</text>
